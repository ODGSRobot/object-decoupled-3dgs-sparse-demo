[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odgs-sparse-demo"
version = "0.2.0"
description = "Paper-facing implementation of structure-constrained data expansion with object-decoupled 3D Gaussian Splatting."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Anonymous Authors"},
]
keywords = [
  "3d-gaussian-splatting",
  "robot-learning",
  "sparse-demonstrations",
  "data-expansion",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]
policy = ["torch==2.7.1", "transformers==4.57.3"]
assets = ["open3d>=0.18"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
